spring:
  application:
    name: chat
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mariadb://localhost:3306/chat
    username: chat
    password: chat
    hikari:
      maximum-pool-size: 20
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
      # session 행 Lock 대기 타임아웃(ms). Hot Session에서 커넥션 고갈 방지
      jakarta.persistence.lock.timeout: 3000

springdoc:
  # 응답 Content-Type을 */* 대신 실제 형식으로 표시
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    org.hibernate.SQL: DEBUG

app:
  snapshot:
    interval: 1000
    recent-messages: 100
    # 비동기 생성이 놓친 Snapshot을 채우는 안전망
    scheduler:
      enabled: true
      fixed-delay: PT1M
      lookback: PT1H
  message-projection:
    # 비동기 반영이 놓친 이벤트를 따라잡는 안전망
    scheduler:
      enabled: true
      fixed-delay: PT1M
      lookback: PT1H

---
# 데모용: 메시지 몇십 개만으로 Snapshot 생성을 확인할 수 있게 간격을 줄임
spring:
  config:
    activate:
      on-profile: demo
app:
  snapshot:
    interval: 20